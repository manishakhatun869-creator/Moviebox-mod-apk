name: Build Towfik Music APKs

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Static resource / binding checks
        run: python3 tools/verify.py

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --console=plain > gradle-tests.log 2>&1 || echo "TESTS_FAILED"

      - name: Build Debug APK
        run: ./gradlew assembleDebug --console=plain > gradle-debug.log 2>&1 || echo "DEBUG_FAILED"

      - name: Build Release APK
        run: ./gradlew assembleRelease --console=plain > gradle-release.log 2>&1 || echo "RELEASE_FAILED"

      - name: Upload Debug APK
        if: hashFiles('app/build/outputs/apk/debug/app-debug.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: towfik-music-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release APK
        if: hashFiles('app/build/outputs/apk/release/app-release-unsigned.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: towfik-music-release-unsigned
          path: app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            gradle-tests.log
            gradle-debug.log
            gradle-release.log

      # Always publish log tails + output listing as a commit comment so they can
      # be read from environments where Actions log / artifact download is blocked.
      - name: Publish build report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "=== outputs tree ==="
            ls -R app/build/outputs 2>/dev/null || echo "(no outputs dir)"
            echo "=== tests tail ==="; tail -n 30 gradle-tests.log 2>/dev/null || true
            echo "=== debug tail ==="; tail -n 30 gradle-debug.log 2>/dev/null || true
            echo "=== release tail ==="; tail -n 30 gradle-release.log 2>/dev/null || true
          } > combined.log
          jq -Rs --arg title "Build report ${{ github.run_id }}" '{title: $title, body: .}' < combined.log > issue.json
          curl -s -o /dev/null -w "issue-create:%{http_code}\n" -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues" \
            --data-binary @issue.json
